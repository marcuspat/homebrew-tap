name: tap-ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  tap-syntax:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: brew test-bot (tap syntax; brew is preinstalled on macOS runners)
        run: |
          brew --version
          brew test-bot --only-tap-syntax
